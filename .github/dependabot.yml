version: 2
updates:
  # npm/pnpm dependencies
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    reviewers:
      - luucasfarias21-a11y
    assignees:
      - luucasfarias21-a11y
    labels:
      - dependencies
      - chore
    commit-message:
      prefix: 'chore(deps):'
      prefix-major: 'chore(deps)!:'
      prefix-minor: 'chore(deps):'
      prefix-patch: 'chore(deps):'
      include: 'scope'
    # Group updates for better organization
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      major-updates:
        update-types:
          - major
